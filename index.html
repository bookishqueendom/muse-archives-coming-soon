<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Muse Archive</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      background: #faf8f5;
      color: #2c2925;
      text-align: center;
    }

    .page {
      max-width: 760px;
    }

    .eyebrow {
      margin-bottom: 24px;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #a18553;
    }

    h1 {
      margin: 0 0 24px;
      font-family: Georgia, serif;
      font-size: clamp(48px, 9vw, 96px);
      font-weight: 400;
      line-height: 0.95;
    }

    .intro {
      margin: 0 auto;
      max-width: 620px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      line-height: 1.7;
      color: #6b6560;
    }

    .status {
      margin-top: 48px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #a18553;
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="eyebrow">The Muse Archive</div>

    <h1>Coming soon.</h1>

    <p class="intro">
      A curated archive of visual works for authors, designers,
      and creators who value intentional imagery.
    </p>

    <div class="status">The archive is being catalogued.</div>
  </main>
</body>
</html>
